version: '3.8'

services:
  # ============================================
  # 方案 A：仅后端服务（数据库使用外部 RDS/MySQL）
  # ============================================
  backend:
    image: ${ACR_REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${ACR_NAMESPACE:-your-namespace}/personal-english-ai-backend:latest
    container_name: personal-english-ai-backend
    restart: always
    depends_on:
      - redis
      - assistant-orchestrator
    ports:
      - "8080:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      
      # 数据库配置（使用外部 RDS 或 MySQL）
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/personal_english_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
      
      # 数据库环境变量（兼容现有配置）
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-personal_english_ai}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}

      # Redis 配置（避免容器内误连 127.0.0.1）
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      
      # JWT 配置
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-must-be-at-least-32-bytes-long-for-security}
      - JWT_ACCESS_TOKEN_SECONDS=${JWT_ACCESS_TOKEN_SECONDS:-1800}
      - JWT_REFRESH_TOKEN_SECONDS=${JWT_REFRESH_TOKEN_SECONDS:-259200}
      
      # Resend API Key（预留，未配置不影响启动）
      - RESEND_API_KEY=${RESEND_API_KEY:-}

      # Email verification SMTP
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      - MAIL_ENABLED=${MAIL_ENABLED:-false}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-noreply@personalenglishai.com}
      - MAIL_SSL_ENABLE=${MAIL_SSL_ENABLE:-true}
      - MAIL_STARTTLS_ENABLE=${MAIL_STARTTLS_ENABLE:-false}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}

      # Python OpenAI Agents SDK orchestrator
      - ASSISTANT_ORCHESTRATOR_BASE_URL=http://assistant-orchestrator:8002
      - AI_ORCHESTRATOR_BASE_URL=${AI_ORCHESTRATOR_BASE_URL:-http://assistant-orchestrator:8002}
      # Vocabulary Python provider is opt-in; service DNS is required inside the Compose network.
      - VOCABULARY_GENERATION_PROVIDER=${VOCABULARY_GENERATION_PROVIDER:-java}
      - VOCABULARY_GENERATION_PYTHON_BASE_URL=http://assistant-orchestrator:8002
      - VOCABULARY_GENERATION_PYTHON_TIMEOUT_MS=${VOCABULARY_GENERATION_PYTHON_TIMEOUT_MS:-60000}
      - VOCABULARY_GENERATION_INTERNAL_TOKEN=${VOCABULARY_GENERATION_INTERNAL_TOKEN:?Set VOCABULARY_GENERATION_INTERNAL_TOKEN}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================
  # 方案 B：MySQL 容器（仅用于快速验证，生产环境建议使用 RDS）
  # ============================================
  # 如需使用方案 B，取消下面的注释，并确保后端服务的 DB_HOST 指向 mysql
  # mysql:
  #   image: mysql:8.0
  #   container_name: personal-english-ai-mysql
  #   restart: always
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
  #     - MYSQL_DATABASE=${MYSQL_DATABASE:-personal_english_ai}
  #     - MYSQL_USER=${MYSQL_USER:-appuser}
  #     - MYSQL_PASSWORD=${MYSQL_PASSWORD:-apppassword}
  #   ports:
  #     - "3306:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - app-network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  redis:
    image: redis:7
    container_name: peai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - peai_redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

  context-sidecar:
    build:
      context: ./python/context_sidecar
    container_name: peai-context-sidecar
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - CONTEXT_SIDECAR_REDIS_URL=redis://redis:6379/0
      - CONTEXT_SIDECAR_REDIS_TTL_SECONDS=${CONTEXT_SIDECAR_REDIS_TTL_SECONDS:-86400}
      - CONTEXT_SIDECAR_REDIS_MAX_MESSAGES=${CONTEXT_SIDECAR_REDIS_MAX_MESSAGES:-50}
      - CONTEXT_SIDECAR_DEFAULT_RECENT_TURNS=${CONTEXT_SIDECAR_DEFAULT_RECENT_TURNS:-8}
    ports:
      - "8001:8001"
    networks:
      - app-network

  assistant-orchestrator:
    build:
      context: ./python/ai_orchestrator
    container_name: peai-assistant-orchestrator
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_ASSISTANT_MODEL=${AI_ASSISTANT_MODEL:-gpt-5.4-mini}
      - AI_ASSISTANT_SESSION_DB_PATH=/data/assistant_sessions.db
      - VOCABULARY_GENERATION_MODEL=${VOCABULARY_GENERATION_MODEL:-gpt-5.4-mini}
      - VOCABULARY_GENERATION_INTERNAL_TOKEN=${VOCABULARY_GENERATION_INTERNAL_TOKEN:?Set VOCABULARY_GENERATION_INTERNAL_TOKEN}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASE_URL=${LANGFUSE_BASE_URL:-}
    ports:
      - "8002:8002"
    volumes:
      - peai_assistant_data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  peai_redis_data:
  peai_assistant_data:

