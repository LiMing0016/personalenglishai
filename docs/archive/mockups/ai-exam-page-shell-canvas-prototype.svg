<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#EEF3F7"/>
    </linearGradient>
    <filter id="shadow" x="40" y="120" width="1520" height="780" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>

  <rect x="0" y="0" width="1600" height="78" fill="#FFFFFF"/>
  <text x="74" y="48" fill="#047857" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">PEAI</text>
  <text x="154" y="48" fill="#0F172A" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="600">写作</text>
  <text x="214" y="48" fill="#475569" font-size="18" font-family="Inter, Arial, sans-serif">单词</text>
  <text x="276" y="48" fill="#475569" font-size="18" font-family="Inter, Arial, sans-serif">听力</text>
  <text x="338" y="48" fill="#475569" font-size="18" font-family="Inter, Arial, sans-serif">口语</text>

  <g filter="url(#shadow)">
    <rect x="64" y="132" width="1472" height="780" rx="28" fill="#FFFFFF"/>
  </g>

  <text x="108" y="196" fill="#64748B" font-size="16" font-family="Inter, Arial, sans-serif">← 返回作文列表</text>
  <text x="108" y="256" fill="#0F172A" font-size="56" font-family="Inter, Arial, sans-serif" font-weight="700">写作练习</text>
  <text x="108" y="300" fill="#64748B" font-size="18" font-family="Inter, Arial, sans-serif">在同一个页面里切模式、整理题单，再开始写作。</text>

  <rect x="1300" y="220" width="172" height="62" rx="20" fill="#047857"/>
  <text x="1350" y="259" fill="#FFFFFF" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">+ 新建作文</text>

  <rect x="108" y="344" width="240" height="52" rx="26" fill="#F8FAFC" stroke="#DCE5EF"/>
  <rect x="112" y="348" width="116" height="44" rx="22" fill="#FFFFFF" stroke="#DCE5EF"/>
  <text x="144" y="377" fill="#475569" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700">自由模式</text>
  <rect x="232" y="348" width="112" height="44" rx="22" fill="#ECFDF5"/>
  <text x="263" y="377" fill="#047857" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700">考试模式</text>

  <line x1="760" y1="430" x2="760" y2="846" stroke="#E5EAF1" stroke-width="2"/>

  <text x="108" y="416" fill="#0F172A" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">左侧：对话输入</text>
  <text x="804" y="416" fill="#0F172A" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">右侧：题单画布</text>

  <rect x="108" y="438" width="612" height="372" rx="28" fill="#FBFCFE" stroke="#E2E8F0"/>
  <text x="146" y="492" fill="#94A3B8" font-size="18" font-family="Inter, Arial, sans-serif">
    例如：请帮我整理一道考研英语风格的作文题，
  </text>
  <text x="146" y="526" fill="#94A3B8" font-size="18" font-family="Inter, Arial, sans-serif">
    主题是年轻人与家庭责任的平衡。我还想加一段材料。
  </text>

  <rect x="146" y="614" width="544" height="72" rx="22" fill="#FFFFFF" stroke="#DCE5EF"/>
  <circle cx="184" cy="650" r="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="177" y="658" fill="#0F766E" font-size="26" font-family="Inter, Arial, sans-serif">+</text>
  <text x="212" y="656" fill="#64748B" font-size="16" font-family="Inter, Arial, sans-serif">添加图片和文件 / 历年真题</text>
  <circle cx="656" cy="650" r="18" fill="#F97316"/>
  <path d="M648 650H664" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M656 642V658" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>

  <rect x="146" y="706" width="188" height="56" rx="18" fill="#FFFFFF" stroke="#DCE5EF"/>
  <text x="172" y="741" fill="#0F172A" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">材料文件已添加</text>

  <text x="108" y="852" fill="#94A3B8" font-size="15" font-family="Inter, Arial, sans-serif">
    左边只保留像 GPT 一样的输入，不再放体裁、字数、满分的配置 chips。
  </text>

  <rect x="804" y="438" width="668" height="408" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="842" y="470" width="592" height="56" rx="18" fill="#FFFFFF" stroke="#E5EAF1"/>
  <rect x="866" y="486" width="72" height="24" rx="12" fill="#EEF2FF"/>
  <text x="890" y="503" fill="#4338CA" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">材料题</text>
  <rect x="952" y="486" width="62" height="24" rx="12" fill="#EFF6FF"/>
  <text x="973" y="503" fill="#1D4ED8" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">议论文</text>
  <rect x="1028" y="486" width="82" height="24" rx="12" fill="#F8FAFC" stroke="#DCE5EF"/>
  <text x="1050" y="503" fill="#475569" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">160-200词</text>
  <rect x="1124" y="486" width="56" height="24" rx="12" fill="#F8FAFC" stroke="#DCE5EF"/>
  <text x="1144" y="503" fill="#475569" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">20分</text>
  <rect x="1192" y="486" width="88" height="24" rx="12" fill="#ECFDF5"/>
  <text x="1218" y="503" fill="#047857" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">编辑参数</text>

  <rect x="842" y="548" width="592" height="244" rx="22" fill="#FFFEF9" stroke="#E7DCC7"/>
  <text x="884" y="606" fill="#0F172A" font-size="38" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Directions:</text>
  <text x="884" y="668" fill="#0F172A" font-size="24" font-family="Georgia, 'Times New Roman', serif">
    Write an essay of 160-200 words based on the
  </text>
  <text x="884" y="704" fill="#0F172A" font-size="24" font-family="Georgia, 'Times New Roman', serif">
    following material. In your essay, you should first
  </text>
  <text x="884" y="740" fill="#0F172A" font-size="24" font-family="Georgia, 'Times New Roman', serif">
    summarize the material, then explain its meaning,
  </text>
  <text x="884" y="776" fill="#0F172A" font-size="24" font-family="Georgia, 'Times New Roman', serif">
    and finally give your own comment.
  </text>

  <line x1="884" y1="804" x2="1310" y2="804" stroke="#E7DCC7"/>

  <rect x="804" y="868" width="668" height="58" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="838" y="904" fill="#64748B" font-size="15" font-family="Inter, Arial, sans-serif">
    页面级返回放在头部：← 返回作文列表。工作台内部不再放“返回修改”。
  </text>

  <rect x="1266" y="944" width="206" height="58" rx="20" fill="#85C8B4"/>
  <text x="1332" y="981" fill="#FFFFFF" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">开始写作</text>
</svg>
