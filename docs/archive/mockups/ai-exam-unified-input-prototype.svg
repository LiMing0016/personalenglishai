<svg width="1440" height="980" viewBox="0 0 1440 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFB"/>
      <stop offset="1" stop-color="#F1F5F8"/>
    </linearGradient>
    <filter id="shadow" x="190" y="110" width="1060" height="700" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#152033" flood-opacity="0.08"/>
    </filter>
    <filter id="menuShadow" x="276" y="514" width="230" height="208" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#152033" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1440" height="980" fill="url(#bg)"/>
  <circle cx="110" cy="100" r="180" fill="#E8F7F2" fill-opacity="0.7"/>

  <rect x="84" y="44" width="206" height="38" rx="18" fill="#E7F6F1"/>
  <text x="104" y="69" fill="#0F8A6C" font-size="14" font-weight="700" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">统一输入区主界面原型</text>
  <text x="84" y="132" fill="#182233" font-size="34" font-weight="800" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">像 GPT 一样先输入，再通过 `+` 注入题目素材</text>
  <text x="84" y="170" fill="#6C7789" font-size="17" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">不再以三个大 Tab 作为主入口。用户只面对一个输入框，`+` 菜单只保留 3 个来源。</text>

  <g filter="url(#shadow)">
    <rect x="212" y="208" width="1016" height="560" rx="30" fill="white" fill-opacity="0.92" stroke="#DDE4EA"/>
  </g>

  <text x="254" y="262" fill="#182233" font-size="40" font-weight="800" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">考试写作 · 智能题目工作台</text>
  <text x="254" y="300" fill="#6C7789" font-size="18" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">描述你想练的作文题，或通过 `+` 插入图片、材料、历年真题，AI 会帮你整理成标准题单。</text>

  <rect x="254" y="350" width="932" height="300" rx="28" fill="#1F1F1F"/>
  <rect x="272" y="368" width="896" height="264" rx="24" fill="#262626"/>

  <text x="298" y="416" fill="#AEB6C2" font-size="17" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">我想练一篇考研风格的作文题，主题是年轻人与父母责任的平衡。</text>
  <text x="298" y="448" fill="#AEB6C2" font-size="17" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">如果有合适的材料，也可以帮我整理成材料作文。</text>

  <rect x="294" y="536" width="38" height="38" rx="19" fill="#2F2F2F" stroke="#4E5661"/>
  <line x1="313" y1="547" x2="313" y2="563" stroke="#E9EEF5" stroke-width="2" stroke-linecap="round"/>
  <line x1="305" y1="555" x2="321" y2="555" stroke="#E9EEF5" stroke-width="2" stroke-linecap="round"/>

  <rect x="350" y="536" width="104" height="38" rx="19" fill="#2F2F2F" stroke="#4E5661"/>
  <text x="376" y="560" fill="#E4EAF2" font-size="15" font-weight="700" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">考研风格</text>

  <rect x="466" y="536" width="92" height="38" rx="19" fill="#2F2F2F" stroke="#4E5661"/>
  <text x="490" y="560" fill="#E4EAF2" font-size="15" font-weight="700" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">160-200</text>

  <rect x="1078" y="534" width="46" height="46" rx="23" fill="#D9D9D9"/>
  <path d="M1101 546V568" stroke="#343A44" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M1091 556L1101 546L1111 556" stroke="#343A44" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="298" y="600" fill="#888F9B" font-size="14" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">输入题目、写作要求或补充说明。未说明的信息可由 AI 自动整理。</text>

  <g filter="url(#menuShadow)">
    <rect x="292" y="552" width="198" height="152" rx="20" fill="#FFFFFF"/>
    <rect x="292" y="552" width="198" height="152" rx="20" stroke="#DEE5EC"/>
  </g>

  <rect x="308" y="568" width="166" height="34" rx="12" fill="#F8FAFB"/>
  <text x="340" y="590" fill="#1F2A3A" font-size="14" font-weight="700" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">上传图片</text>
  <circle cx="324" cy="585" r="8" fill="#E7F6F1"/>
  <path d="M320 586L323 583L326 586L329 582" stroke="#0F8A6C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="308" y="610" width="166" height="34" rx="12" fill="#F8FAFB"/>
  <text x="340" y="632" fill="#1F2A3A" font-size="14" font-weight="700" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">上传材料</text>
  <rect x="317" y="623" width="14" height="10" rx="2" stroke="#0F8A6C" stroke-width="1.5"/>
  <line x1="320" y1="626" x2="328" y2="626" stroke="#0F8A6C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="320" y1="630" x2="328" y2="630" stroke="#0F8A6C" stroke-width="1.5" stroke-linecap="round"/>

  <rect x="308" y="652" width="166" height="34" rx="12" fill="#F8FAFB"/>
  <text x="340" y="674" fill="#1F2A3A" font-size="14" font-weight="700" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">历年真题</text>
  <rect x="317" y="663" width="14" height="12" rx="2" stroke="#0F8A6C" stroke-width="1.5"/>
  <line x1="320" y1="666" x2="328" y2="666" stroke="#0F8A6C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="320" y1="670" x2="328" y2="670" stroke="#0F8A6C" stroke-width="1.5" stroke-linecap="round"/>

  <text x="254" y="706" fill="#6C7789" font-size="14" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">`+` 菜单只保留 3 项：上传图片、上传材料、历年真题。</text>

  <rect x="84" y="826" width="1272" height="92" rx="24" fill="white" fill-opacity="0.9" stroke="#DDE4EA"/>
  <text x="118" y="860" fill="#182233" font-size="18" font-weight="800" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">这版主界面的产品含义</text>
  <text x="118" y="892" fill="#5E6E81" font-size="16" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">用户只关心“我要什么题”，AI 负责把输入框内容和 `+` 注入的素材整理成标准题单，然后进入统一预览页。</text>
</svg>
