<svg width="1720" height="980" viewBox="0 0 1720 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1720" height="980" fill="#F6F8FB"/>

  <text x="70" y="70" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">写作工作区题单展开原型 · 纸张风格</text>
  <text x="70" y="104" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="18">延续题目整理页的纸张式题单，而不是通用信息面板</text>

  <rect x="52" y="140" width="1616" height="790" rx="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="90" y="185" width="1540" height="76" rx="24" fill="#FFFFFF"/>
  <text x="114" y="234" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="30">‹</text>
  <text x="585" y="234" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">考试写作</text>
  <text x="1136" y="232" fill="#64748B" font-family="Inter, Arial, sans-serif" font-size="20">285 词 · 19 句 · 6 段</text>
  <text x="1302" y="232" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">清空</text>
  <rect x="1384" y="196" width="74" height="42" rx="14" fill="#0F766E"/>
  <text x="1408" y="223" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">提交</text>
  <rect x="1486" y="194" width="116" height="46" rx="23" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/>
  <text x="1516" y="223" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">收起题单</text>

  <!-- editor area -->
  <rect x="92" y="294" width="938" height="590" rx="24" fill="#FFFFFF"/>
  <text x="182" y="388" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">Nowadays, online learning become more and more popular,</text>
  <text x="182" y="430" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">especially after the pandemic. Many student thinks it is a</text>
  <text x="182" y="472" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">convenient way to study, because they can learn knowledges</text>
  <text x="182" y="514" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">at home and save many times. However, other people believe</text>
  <text x="182" y="556" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">that traditional learning are still more effective.</text>

  <text x="182" y="640" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">First of all, online learning provide students more flexibility.</text>
  <text x="182" y="682" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">Students can choose the time what they want to study and</text>
  <text x="182" y="724" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">watch the lesson repeatly. If they do not understand a point,</text>
  <text x="182" y="766" fill="#1E293B" font-family="Georgia, Times New Roman, serif" font-size="26">they can replay it for many time.</text>

  <!-- tool rail -->
  <rect x="1610" y="360" width="36" height="312" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="1616" y="376" width="24" height="48" rx="12" fill="#FCE7F3"/>
  <rect x="1616" y="436" width="24" height="48" rx="12" fill="#ECFDF5"/>
  <rect x="1616" y="496" width="24" height="48" rx="12" fill="#E0F2FE"/>
  <rect x="1616" y="556" width="24" height="48" rx="12" fill="#FEF3C7"/>
  <rect x="1616" y="616" width="24" height="48" rx="12" fill="#F1F5F9"/>

  <!-- paper shell -->
  <rect x="1056" y="286" width="530" height="606" rx="28" fill="#F8FBFD"/>
  <rect x="1092" y="326" width="458" height="526" rx="28" fill="#FFFDF9" stroke="#E7ECF3" stroke-width="2"/>

  <!-- chips -->
  <rect x="1134" y="362" width="104" height="50" rx="25" fill="#DDF5EE" stroke="#B4E4D5" stroke-width="2"/>
  <text x="1166" y="393" fill="#0F766E" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Task 1</text>

  <rect x="1254" y="362" width="170" height="50" rx="25" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  <text x="1289" y="393" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Picture-based Essay</text>

  <rect x="1440" y="362" width="98" height="50" rx="25" fill="#FFFFFF" stroke="#D8E3EE" stroke-width="2"/>
  <text x="1468" y="393" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">200词</text>

  <!-- paper content -->
  <text x="1190" y="454" fill="#0F172A" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Task 1</text>

  <text x="1138" y="520" fill="#8B6A2B" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="1.6">DIRECTIONS:</text>

  <text x="1138" y="576" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700">Write an essay about the ethnic diversity</text>
  <text x="1138" y="618" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700">and cultural heritage of Guizhou Province.</text>
  <text x="1138" y="660" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700">In your essay, you should: 1) describe the</text>
  <text x="1138" y="702" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700">unique ethnic groups found in Guizhou,</text>
  <text x="1138" y="744" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700">2) discuss the cultural significance of</text>
  <text x="1138" y="786" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700">their traditions, and 3) reflect on the</text>
  <text x="1138" y="828" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="700">broader implications of preservation.</text>

  <text x="1138" y="882" fill="#334155" font-family="Georgia, Times New Roman, serif" font-size="20">字数要求：300-500 词   满分：100 分</text>

  <!-- note -->
  <rect x="90" y="900" width="1540" height="20" rx="10" fill="#E0F2FE"/>
  <text x="112" y="914" fill="#0C4A6E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">题单展开后仍然保持题目整理页的“纸张 + 芯片 + 正文排版”风格，只是缩放后放进写作工作区右侧。</text>
</svg>
