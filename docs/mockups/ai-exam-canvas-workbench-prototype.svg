<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#EEF3F7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFCFD"/>
    </linearGradient>
    <filter id="shadow" x="220" y="90" width="1160" height="820" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="soft" x="0" y="0" width="1600" height="980" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>

  <g opacity="0.6">
    <circle cx="126" cy="144" r="140" fill="#DFF6EE"/>
    <circle cx="1490" cy="870" r="170" fill="#E7EEF8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="260" y="130" width="1080" height="740" rx="28" fill="url(#card)"/>
  </g>

  <text x="320" y="210" fill="#0F172A" font-size="28" font-family="Inter, Arial, sans-serif" font-weight="700">考试写作 · AI 命题工作台</text>
  <text x="320" y="246" fill="#64748B" font-size="16" font-family="Inter, Arial, sans-serif">
    左边像 GPT 一样描述需求，右边实时整理成题单画布。参数信息不再占据左边表单。
  </text>

  <rect x="1164" y="184" width="124" height="34" rx="17" fill="#ECFDF5"/>
  <text x="1189" y="206" fill="#047857" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700">Workbench + Canvas</text>

  <line x1="778" y1="286" x2="778" y2="810" stroke="#E5EAF1" stroke-width="2"/>

  <text x="320" y="314" fill="#0F172A" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">左侧：对话输入</text>
  <text x="842" y="314" fill="#0F172A" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">右侧：题单画布</text>

  <rect x="320" y="338" width="418" height="440" rx="24" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#soft)"/>
  <rect x="350" y="366" width="248" height="74" rx="18" fill="#F8FAFC" stroke="#E5EAF1"/>
  <text x="370" y="395" fill="#64748B" font-size="14" font-family="Inter, Arial, sans-serif">我想练一道考研英语风格的作文题，</text>
  <text x="370" y="419" fill="#64748B" font-size="14" font-family="Inter, Arial, sans-serif">主题是年轻人与家庭责任的平衡。</text>

  <rect x="420" y="458" width="286" height="98" rx="18" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="440" y="486" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">AI：</text>
  <text x="468" y="486" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif">我会整理成一题考试写作题单。</text>
  <text x="440" y="512" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif">如果你有材料或题图，可以通过 + 添加。</text>
  <text x="440" y="538" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif">右侧会同步显示体裁、字数和满分。</text>

  <rect x="350" y="580" width="148" height="54" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/>
  <text x="370" y="611" fill="#0F172A" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">历年真题已插入</text>

  <rect x="516" y="580" width="190" height="54" rx="16" fill="#FFFFFF" stroke="#DCE5EF"/>
  <text x="536" y="611" fill="#0F172A" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">图片附件：家庭场景</text>

  <rect x="340" y="678" width="378" height="78" rx="20" fill="#FBFCFE" stroke="#DCE5EF"/>
  <text x="366" y="710" fill="#94A3B8" font-size="14" font-family="Inter, Arial, sans-serif">继续补充要求，或粘贴材料内容...</text>
  <circle cx="372" cy="732" r="14" fill="#FFFFFF" stroke="#0F766E"/>
  <text x="366" y="738" fill="#0F766E" font-size="22" font-family="Inter, Arial, sans-serif">+</text>
  <text x="394" y="737" fill="#64748B" font-size="12" font-family="Inter, Arial, sans-serif">添加图片和文件 / 历年真题</text>
  <circle cx="688" cy="722" r="15" fill="#F97316"/>
  <path d="M681 722H695" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M688 715V729" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

  <text x="320" y="806" fill="#94A3B8" font-size="13" font-family="Inter, Arial, sans-serif">
    左边不再放体裁、字数、分值的 chips。这里专注于“说清楚你要什么题”。
  </text>

  <rect x="842" y="338" width="438" height="472" rx="24" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="870" y="364" width="384" height="52" rx="18" fill="#FFFFFF" stroke="#E5EAF1"/>
  <rect x="888" y="378" width="66" height="24" rx="12" fill="#EEF2FF"/>
  <text x="910" y="394" fill="#4338CA" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">材料题</text>
  <rect x="968" y="378" width="60" height="24" rx="12" fill="#EFF6FF"/>
  <text x="987" y="394" fill="#1D4ED8" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">议论文</text>
  <rect x="1040" y="378" width="76" height="24" rx="12" fill="#F8FAFC" stroke="#DCE5EF"/>
  <text x="1062" y="394" fill="#475569" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">160-200词</text>
  <rect x="1128" y="378" width="54" height="24" rx="12" fill="#F8FAFC" stroke="#DCE5EF"/>
  <text x="1147" y="394" fill="#475569" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">20分</text>
  <rect x="1192" y="378" width="44" height="24" rx="12" fill="#ECFDF5"/>
  <text x="1204" y="394" fill="#047857" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">编辑</text>

  <rect x="884" y="438" width="354" height="328" rx="20" fill="#FFFEF9" stroke="#E7DCC7"/>
  <text x="914" y="482" fill="#0F172A" font-size="18" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Part B</text>
  <text x="914" y="526" fill="#0F172A" font-size="34" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Directions:</text>

  <text x="914" y="578" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    Write an essay of 160-200 words based on the
  </text>
  <text x="914" y="610" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    following material. In your essay, you should first
  </text>
  <text x="914" y="642" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    summarize the material, then explain its meaning,
  </text>
  <text x="914" y="674" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    and finally give your own comment.
  </text>

  <line x1="914" y1="702" x2="1208" y2="702" stroke="#E7DCC7"/>

  <text x="914" y="734" fill="#8A6D3B" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1.8">ATTACHMENT / MATERIAL</text>
  <text x="914" y="764" fill="#334155" font-size="15" font-family="Georgia, 'Times New Roman', serif">
    Nowadays, more and more young people find themselves
  </text>
  <text x="914" y="788" fill="#334155" font-size="15" font-family="Georgia, 'Times New Roman', serif">
    caught between personal ambition and family duties...
  </text>

  <rect x="842" y="826" width="438" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="870" y="853" fill="#64748B" font-size="13" font-family="Inter, Arial, sans-serif">
    右边承担参数展示和轻编辑，默认展示，不默认把用户拖进表单配置。
  </text>

  <rect x="1138" y="894" width="142" height="46" rx="16" fill="#85C8B4"/>
  <text x="1177" y="923" fill="#FFFFFF" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">开始写作</text>

  <rect x="260" y="894" width="140" height="46" rx="16" fill="#FFFFFF" stroke="#D9E1EA"/>
  <text x="294" y="923" fill="#475569" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="600">返回修改</text>
</svg>
