<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#EEF3F7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBFCFD"/>
    </linearGradient>
    <filter id="shadow" x="120" y="90" width="1360" height="860" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="74" cy="156" r="168" fill="#DFF6EE" fill-opacity="0.72"/>
  <circle cx="1490" cy="838" r="176" fill="#E6EEF9" fill-opacity="0.8"/>

  <g filter="url(#shadow)">
    <rect x="160" y="120" width="1280" height="780" rx="30" fill="url(#card)"/>
  </g>

  <text x="232" y="184" fill="#64748B" font-size="18" font-family="Inter, Arial, sans-serif">← 返回作文列表</text>

  <text x="232" y="252" fill="#0F172A" font-size="58" font-family="Inter, Arial, sans-serif" font-weight="700">写作工作台</text>
  <text x="232" y="298" fill="#64748B" font-size="18" font-family="Inter, Arial, sans-serif">
    模式切换和题目整理都在同一页面完成。左侧负责对话输入，右侧负责题单画布。
  </text>

  <rect x="1120" y="218" width="214" height="46" rx="23" fill="#F8FAFC" stroke="#DCE5EF"/>
  <rect x="1124" y="222" width="102" height="38" rx="19" fill="#FFFFFF" stroke="#DCE5EF"/>
  <text x="1153" y="246" fill="#475569" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">自由模式</text>
  <rect x="1230" y="222" width="100" height="38" rx="19" fill="#ECFDF5"/>
  <text x="1259" y="246" fill="#047857" font-size="15" font-family="Inter, Arial, sans-serif" font-weight="700">考试模式</text>

  <line x1="808" y1="330" x2="808" y2="832" stroke="#E5EAF1" stroke-width="2"/>

  <text x="232" y="366" fill="#0F172A" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">左侧：对话输入</text>
  <text x="852" y="366" fill="#0F172A" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="700">右侧：题单画布</text>

  <rect x="232" y="392" width="500" height="474" rx="28" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="268" y="444" fill="#94A3B8" font-size="18" font-family="Inter, Arial, sans-serif">
    例如：请帮我整理一道考研英语风格的作文题，
  </text>
  <text x="268" y="478" fill="#94A3B8" font-size="18" font-family="Inter, Arial, sans-serif">
    主题是年轻人与家庭责任的平衡。我还想加一段材料。
  </text>

  <rect x="268" y="532" width="270" height="78" rx="20" fill="#F8FAFC" stroke="#E5EAF1"/>
  <text x="294" y="565" fill="#475569" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="600">用户： 给我整理一道考研英语材料题</text>
  <text x="294" y="592" fill="#64748B" font-size="14" font-family="Inter, Arial, sans-serif">主题是家庭责任与个人发展</text>

  <rect x="366" y="630" width="314" height="118" rx="22" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="390" y="666" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">AI:</text>
  <text x="426" y="666" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif">已切到考试模式。我会整理成标准题单，</text>
  <text x="390" y="694" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif">字数、满分、体裁会显示在右边画布顶部。</text>
  <text x="390" y="722" fill="#166534" font-size="14" font-family="Inter, Arial, sans-serif">如果你有材料或题图，可以通过 + 添加。</text>

  <rect x="268" y="780" width="188" height="58" rx="18" fill="#FFFFFF" stroke="#DCE5EF"/>
  <text x="296" y="816" fill="#0F172A" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="600">材料文件已添加</text>

  <rect x="268" y="724" width="420" height="58" rx="18" fill="#FFFFFF" stroke="#DCE5EF"/>
  <circle cx="304" cy="753" r="16" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
  <text x="296" y="760" fill="#0F766E" font-size="26" font-family="Inter, Arial, sans-serif">+</text>
  <text x="336" y="758" fill="#64748B" font-size="14" font-family="Inter, Arial, sans-serif">添加图片和文件 / 历年真题</text>
  <circle cx="652" cy="753" r="18" fill="#F97316"/>
  <path d="M644 753H660" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M652 745V761" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>

  <text x="232" y="886" fill="#94A3B8" font-size="15" font-family="Inter, Arial, sans-serif">
    左边不再放体裁、字数、分值参数。这里只负责像 GPT 一样对话式输入。
  </text>

  <rect x="852" y="392" width="500" height="500" rx="28" fill="#F8FAFC" stroke="#E2E8F0"/>
  <rect x="888" y="424" width="428" height="56" rx="18" fill="#FFFFFF" stroke="#E5EAF1"/>
  <rect x="910" y="440" width="72" height="24" rx="12" fill="#EEF2FF"/>
  <text x="934" y="457" fill="#4338CA" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">材料题</text>
  <rect x="996" y="440" width="62" height="24" rx="12" fill="#EFF6FF"/>
  <text x="1018" y="457" fill="#1D4ED8" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">议论文</text>
  <rect x="1072" y="440" width="82" height="24" rx="12" fill="#F8FAFC" stroke="#DCE5EF"/>
  <text x="1096" y="457" fill="#475569" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">160-200词</text>
  <rect x="1168" y="440" width="56" height="24" rx="12" fill="#F8FAFC" stroke="#DCE5EF"/>
  <text x="1189" y="457" fill="#475569" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">20分</text>
  <rect x="1236" y="440" width="68" height="24" rx="12" fill="#ECFDF5"/>
  <text x="1258" y="457" fill="#047857" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="700">编辑参数</text>

  <rect x="904" y="514" width="396" height="360" rx="22" fill="#FFFEF9" stroke="#E7DCC7"/>
  <text x="944" y="572" fill="#0F172A" font-size="36" font-family="Georgia, 'Times New Roman', serif" font-weight="700">Directions:</text>
  <text x="944" y="632" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    Write an essay of 160-200 words based on the
  </text>
  <text x="944" y="666" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    following material. In your essay, you should first
  </text>
  <text x="944" y="700" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    summarize the material, then explain its meaning,
  </text>
  <text x="944" y="734" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    and finally give your own comment.
  </text>

  <line x1="944" y1="758" x2="1248" y2="758" stroke="#E7DCC7"/>
  <text x="944" y="794" fill="#8A6D3B" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700" letter-spacing="1.8">MATERIAL</text>
  <text x="944" y="828" fill="#334155" font-size="16" font-family="Georgia, 'Times New Roman', serif">
    Nowadays, more and more young people find themselves caught
  </text>
  <text x="944" y="854" fill="#334155" font-size="16" font-family="Georgia, 'Times New Roman', serif">
    between personal ambition and family responsibilities...
  </text>

  <rect x="1108" y="922" width="244" height="60" rx="20" fill="#85C8B4"/>
  <text x="1188" y="960" fill="#FFFFFF" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">开始写作</text>
</svg>
