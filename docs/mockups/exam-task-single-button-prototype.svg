  <text x="160" y="191" fill="#475569" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Task 1</text>
  <rect x="118" y="208" width="132" height="30" rx="15" fill="#DCFCE7" stroke="#86EFAC" stroke-width="2"/>
  <text x="160" y="229" fill="#166534" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Task 2</text>

  <text x="110" y="308" fill="#8A6D3B" font-size="26" font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="4">DIRECTIONS:</text>

  <text x="110" y="382" fill="#0F172A" font-size="24" font-family="Georgia, 'Times New Roman', serif">
    <tspan x="110" dy="0">Write an essay of about 200 words based on the following</tspan>
    <tspan x="110" dy="52">comic strip. In your essay, you should: 1) describe the comic</tspan>
    <tspan x="110" dy="52">briefly, 2) interpret the implied meaning of the 'Agent Race'</tspan>
    <tspan x="110" dy="52">between the two AI companies, and 3) give your comments</tspan>
    <tspan x="110" dy="52">on how this competition influences the development of AI.</tspan>
  </text>

  <text x="132" y="676" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    <tspan x="132" dy="0">• You should write about 200 words neatly on the ANSWER SHEET.</tspan>
    <tspan x="162" dy="48">Do not sign your own name at the end of the essay.</tspan>
  </text>

  <text x="110" y="804" fill="#475569" font-size="20" font-family="Georgia, 'Times New Roman', serif">
    <tspan x="110" dy="0">字数要求：200 词</tspan>
    <tspan x="320" dy="0">满分：100 分</tspan>
