  <rect x="914" y="86" width="188" height="54" rx="27" fill="#ECFDF5" stroke="#9FD7BC" stroke-width="2"/>
  <circle cx="953" cy="113" r="6" fill="#10B981"/>
  <text x="971" y="120" fill="#047857" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="700">重新整理中...</text>

  <text x="110" y="212" fill="#8A6D3B" font-size="26" font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="4">DIRECTIONS:</text>

  <text x="110" y="286" fill="#0F172A" font-size="24" font-family="Georgia, 'Times New Roman', serif">
    <tspan x="110" dy="0">Write an essay of about 200 words based on the following</tspan>
    <tspan x="110" dy="52">comic strip. In your essay, you should: 1) describe the comic</tspan>
    <tspan x="110" dy="52">briefly, 2) interpret the implied meaning of the 'Agent Race'</tspan>
    <tspan x="110" dy="52">between the two AI companies, and 3) give your comments</tspan>
    <tspan x="110" dy="52">on how this competition influences the development of AI.</tspan>
  </text>

  <text x="132" y="580" fill="#0F172A" font-size="22" font-family="Georgia, 'Times New Roman', serif">
    <tspan x="132" dy="0">• You should write about 200 words neatly on the ANSWER SHEET.</tspan>
    <tspan x="162" dy="48">Do not sign your own name at the end of the essay.</tspan>
  </text>

  <text x="110" y="712" fill="#475569" font-size="20" font-family="Georgia, 'Times New Roman', serif">
    <tspan x="110" dy="0">字数要求：200 词</tspan>
    <tspan x="320" dy="0">满分：100 分</tspan>
  </text>

  <line x1="110" y1="754" x2="1090" y2="754" stroke="#EBE4D8" stroke-width="2"/>

