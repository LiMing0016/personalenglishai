  <text x="1328" y="490" fill="#8B6A2B" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5">DIRECTIONS:</text>

  <text x="1328" y="532" fill="#0F172A" font-family="Georgia, Times New Roman, serif" font-size="20">Write an essay of about 200 words based on</text>
