  <rect x="82" y="876" width="708" height="30" rx="15" fill="#FEF3C7"/>
  <text x="104" y="896" fill="#92400E" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">入口放在顶部操作区，不占用右侧工具栏，也不影响提交链路。</text>

  <rect x="932" y="876" width="708" height="30" rx="15" fill="#DCFCE7"/>
