  <!-- Notes -->
  <rect x="44" y="1052" width="536" height="44" rx="12" fill="#ffffff" stroke="#d7e2ec"/>
  <text x="66" y="1080" class="text tiny bold">IDE 感来源：</text>
  <text x="170" y="1080" class="text tiny muted">活动栏、资源树、标签页、右侧上下文面板、状态栏</text>
  <rect x="604" y="1052" width="552" height="44" rx="12" fill="#ffffff" stroke="#d7e2ec"/>
  <text x="626" y="1080" class="text tiny bold">学习感来源：</text>
  <text x="730" y="1080" class="text tiny muted">PDF 锚点、笔记 Markdown、AI 候选补充、资产沉淀</text>
  <rect x="1180" y="1052" width="576" height="44" rx="12" fill="#ffffff" stroke="#d7e2ec"/>
  <text x="1202" y="1080" class="text tiny bold">实现原则：</text>
  <text x="1306" y="1080" class="text tiny muted">外框 IDE 化，阅读区保持明亮，避免整页过暗影响阅读</text>
</svg>
