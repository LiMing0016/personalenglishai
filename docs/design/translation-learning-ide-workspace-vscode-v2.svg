  <rect x="1542" y="914" width="190" height="42" rx="10" class="teal"/>
  <text x="1604" y="942" class="white" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="800">保存笔记</text>

  <!-- Status bar -->
  <rect x="44" y="990" width="1712" height="40" fill="#0f766e"/>
  <text x="68" y="1016" class="white tiny bold">工作区：数据结构学习</text>
  <text x="310" y="1016" class="white tiny">PDF 2</text>
  <text x="390" y="1016" class="white tiny">笔记 7</text>
