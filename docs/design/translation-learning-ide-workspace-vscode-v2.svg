  <text x="1350" y="214" class="text-dark h2">笔记工作台</text>
  <rect x="1562" y="190" width="100" height="30" rx="15" class="blue-soft"/>
  <text x="1584" y="210" class="text-dark tiny" fill="#9ec5ff">P25 选区</text>
  <text x="1682" y="211" class="text-dark tiny muted-dark">返回 Agent</text>

  <rect x="1348" y="254" width="384" height="42" rx="10" fill="#1f2329" stroke="#3d4854"/>
  <rect x="1354" y="260" width="114" height="30" rx="8" class="teal-soft"/>
  <text x="1384" y="280" class="text-dark tiny bold" fill="#2dd4bf">写笔记</text>
  <text x="1506" y="280" class="text-dark tiny muted-dark">问 AI</text>
  <text x="1626" y="280" class="text-dark tiny muted-dark">整理</text>

  <text x="1348" y="342" class="text-dark tiny bold muted-dark">ANCHOR</text>
  <rect x="1348" y="360" width="384" height="78" rx="10" fill="#1f2329" stroke="#3d4854"/>
  <text x="1368" y="392" class="text-dark tiny">排序问题在算法设计与分析中扮演着重要角色...</text>
  <text x="1368" y="416" class="text-dark tiny muted-dark">Page 25 · 1.1.3 起泡排序</text>

  <text x="1348" y="484" class="text-dark tiny bold muted-dark">NOTE.md</text>
  <rect x="1348" y="502" width="384" height="188" rx="10" fill="#111827" stroke="#178f84" stroke-width="2"/>
  <text x="1368" y="536" class="text-dark small bold"># 起泡排序复杂度</text>
  <text x="1368" y="572" class="text-dark tiny muted-dark">这里先限定整数排序，是为了建立排序问题的</text>
  <text x="1368" y="598" class="text-dark tiny muted-dark">定义边界，再讨论局部交换如何得到整体有序。</text>
  <text x="1368" y="646" class="text-dark tiny" fill="#2dd4bf">Agent 补充会进入候选区，确认后追加。</text>

  <text x="1348" y="732" class="text-dark tiny bold muted-dark">ACTIONS</text>
  <rect x="1348" y="750" width="116" height="36" rx="9" class="teal-soft"/>
  <text x="1368" y="774" class="text-dark tiny bold" fill="#2dd4bf">补充解释</text>
  <rect x="1482" y="750" width="116" height="36" rx="9" class="teal-soft"/>
  <text x="1502" y="774" class="text-dark tiny bold" fill="#2dd4bf">整理要点</text>
