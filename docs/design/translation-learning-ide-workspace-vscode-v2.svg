<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
    <style>
      .page { fill: #eef3f8; }
      .chrome { fill: #1f2329; }
      .chrome-2 { fill: #252a31; }
      .chrome-3 { fill: #2d333b; }
      .line { stroke: #3b4652; stroke-width: 1; }
      .panel-light { fill: #f8fbfd; stroke: #d7e2ec; stroke-width: 1.2; }
      .paper { fill: #e7fbf1; }
      .teal { fill: #0f9b8e; }
      .teal-soft { fill: #173f3c; stroke: #178f84; stroke-width: 1.2; }
      .teal-soft-light { fill: #dff9f2; stroke: #89ded1; stroke-width: 1.2; }
      .blue-soft { fill: #1f3557; stroke: #2d5fa8; stroke-width: 1.1; }
      .yellow-soft { fill: #3d3520; stroke: #806421; stroke-width: 1.1; }
      .text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #111827; }
      .text-dark { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #d7dde5; }
      .muted { fill: #748295; }
      .muted-dark { fill: #9aa6b5; }
      .white { fill: #ffffff; }
      .accent { fill: #2dd4bf; }
      .tiny { font-size: 15px; }
      .small { font-size: 18px; }
      .body { font-size: 22px; }
      .h2 { font-size: 26px; font-weight: 800; }
      .h3 { font-size: 21px; font-weight: 800; }
      .title { font-size: 34px; font-weight: 850; }
      .bold { font-weight: 800; }
      .mono { font-family: Consolas, "Microsoft YaHei", monospace; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1120"/>
  <text x="54" y="64" class="text title">学习 IDE · VSCode 风格方向</text>
  <text x="54" y="100" class="text muted body">把 PDF、笔记、专题当作“工作区文件”打开；Agent 是右侧上下文辅助面板，锚点笔记时切换为笔记工作台。</text>

  <rect x="44" y="130" width="1712" height="900" rx="18" class="chrome" filter="url(#softShadow)"/>

  <!-- IDE title bar -->
  <rect x="44" y="130" width="1712" height="48" rx="18" fill="#20242a"/>
  <text x="70" y="161" class="text-dark small bold">Personal English AI</text>
  <text x="264" y="161" class="text-dark tiny muted-dark">学习工作台</text>
  <rect x="720" y="140" width="360" height="28" rx="14" fill="#171b20" stroke="#3b4652"/>
  <text x="790" y="159" class="text-dark tiny muted-dark">搜索 PDF、笔记、知识点，或输入命令...</text>
  <text x="1646" y="161" class="text-dark tiny muted-dark">同步中</text>
  <circle cx="1708" cy="154" r="7" fill="#2dd4bf"/>

  <!-- Activity bar -->
  <rect x="44" y="178" width="64" height="812" fill="#1b1f24"/>
  <line x1="108" y1="178" x2="108" y2="990" class="line"/>
  <rect x="55" y="202" width="42" height="42" rx="10" class="teal-soft"/>
