  <!-- Explorer -->
  <rect x="108" y="178" width="344" height="812" class="chrome-2"/>
  <line x1="452" y1="178" x2="452" y2="990" class="line"/>
  <text x="132" y="218" class="text-dark tiny bold muted-dark">学习资源</text>
  <text x="132" y="258" class="text-dark h2">EXPLORER</text>
  <rect x="132" y="284" width="294" height="40" rx="9" fill="#1f2329" stroke="#3d4854"/>
  <text x="150" y="310" class="text-dark tiny muted-dark">搜索章节、笔记、PDF...</text>

