  <rect x="132" y="388" width="294" height="44" rx="8" fill="#173f3c" stroke="#178f84"/>
  <text x="154" y="416" class="text-dark tiny bold" fill="#2dd4bf">PDF  数据结构 C++ 第三版</text>
  <rect x="132" y="440" width="294" height="44" rx="8" fill="#2d333b"/>
  <text x="154" y="468" class="text-dark tiny">笔记  起泡排序复杂度</text>
  <rect x="132" y="492" width="294" height="44" rx="8" fill="#2d333b"/>
  <text x="154" y="520" class="text-dark tiny">专题  排序算法</text>

  <text x="132" y="584" class="text-dark tiny bold muted-dark">数据结构 C++ 第三版</text>
  <text x="154" y="622" class="text-dark small">▾ 第1章 绪论</text>
  <text x="180" y="660" class="text-dark tiny muted-dark">▸ §1.1 计算机与算法</text>
  <rect x="168" y="678" width="238" height="34" rx="8" fill="#173f3c"/>
  <text x="184" y="701" class="text-dark tiny bold" fill="#2dd4bf">▾ 1.1.3 起泡排序</text>
  <text x="206" y="738" class="text-dark tiny muted-dark">□ 局部有序与整体有序</text>
  <text x="206" y="774" class="text-dark tiny muted-dark">□ 扫描交换</text>
  <text x="206" y="810" class="text-dark tiny muted-dark">□ 起泡排序</text>
  <text x="154" y="854" class="text-dark small muted-dark">▸ 第2章 向量</text>
  <text x="154" y="892" class="text-dark small muted-dark">▸ 第3章 列表</text>

  <rect x="132" y="926" width="136" height="38" rx="9" fill="#2d333b" stroke="#46525f"/>
